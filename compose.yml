# Bants server — Docker Compose
# On Unraid: Docker tab → Compose Manager → Add New Stack → paste this in,
# set INVITE_CODE in the stack's .env, then "Compose Up".
name: bants

services:
  bants:
    # Pre-built image from GitHub Actions. To build from source on the server instead,
    # comment out "image" and uncomment "build", then run: docker compose up -d --build
    image: ghcr.io/wellsey001/bants:latest
    # build: https://github.com/wellsey001/Bants.git#main
    container_name: bants-server
    restart: unless-stopped
    ports:
      - "42069:42069"
    volumes:
      - /mnt/user/appdata/bants-server:/data
    environment:
      PORT: "42069"
      DATA_DIR: /data
      INVITE_CODE: ${INVITE_CODE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-}
      GIF_RATING: ${GIF_RATING:-r}
      TZ: Europe/London
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/wellsey001/Bants/main/assets/icon.png
      net.unraid.docker.webui: http://[IP]:[PORT:42069]/admin

  # Relays call audio/video when two phones can't connect directly (common on mobile data).
  # Needs router ports 3478 (UDP+TCP) and 49160-49200 (UDP) forwarded to Unraid. See README.
  coturn:
    image: coturn/coturn:4
    container_name: bants-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      DETECT_EXTERNAL_IP: "yes"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Add TURN_SECRET to the stack's ENV}
      - --realm=${TURN_HOST:-bants}
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-multicast-peers
      - --total-quota=50
      # Never relay into your home network.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
