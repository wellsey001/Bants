name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      # The web version is the Windows app's screens, served by the server itself.
      - name: Get the web version (from bants-desktop)
        uses: actions/checkout@v4
        with:
          repository: wellsey001/bants-desktop
          ref: main
          path: desktop

      - name: Add the web version to the image
        run: |
          cp -r desktop/renderer/. web/
          # Camera backgrounds load MediaPipe from /node_modules/ (the same path the Windows app uses).
          mkdir -p /tmp/mp && cd /tmp/mp && npm init -y >/dev/null && npm install --no-audit --no-fund @mediapipe/tasks-vision@0.10.14
          mkdir -p "$GITHUB_WORKSPACE/web/node_modules/@mediapipe"
          cp -r /tmp/mp/node_modules/@mediapipe/tasks-vision "$GITHUB_WORKSPACE/web/node_modules/@mediapipe/"
          rm -rf "$GITHUB_WORKSPACE/desktop"
          ls "$GITHUB_WORKSPACE/web"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
